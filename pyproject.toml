[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "derm"
version = "1.0.0"
description = "Explainable dermoscopic skin lesion classification with EfficientNet-B3, Grad-CAM and automated severity grading"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["dermoscopy", "melanoma", "explainable-ai", "grad-cam", "medical-imaging", "ham10000"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=0.9.12",
    "numpy>=1.24,<3",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.5",
    "reportlab>=4.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.26",
    "ruff>=0.4",
]

[project.scripts]
derm-train = "derm.train:main"
derm-evaluate = "derm.evaluate:main"
derm-baseline = "derm.baseline:main"

[project.urls]
Repository = "https://github.com/karthik/dermoscopic-lesion-classification"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
