services:
  - type: web
    name: dermoscopic-lesion-classifier
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Free-tier CPU is a fraction of one core. Dropping test-time
      # augmentation and MC-dropout passes keeps each request to a single
      # forward pass so it doesn't time out or exceed the 512MB memory limit.
      # Raise these back up (DERM_TTA=5, DERM_MC_PASSES=10) on a paid plan.
      - key: DERM_TTA
        value: "1"
      - key: DERM_MC_PASSES
        value: "0"
      - key: DERM_CORS_ORIGINS
        value: "*"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Rendered-overlay resolution. Kept small on the 512MB free tier.
      - key: DERM_DISPLAY_SIZE
        value: "256"
      # Cap the resolution the pipeline works at. The measured headroom on the
      # free tier is only ~150MB above the ~360MB model floor, and every
      # geometric stage (hair removal, colour constancy, segmentation, ABCD)
      # allocates full-working-size arrays, so peak scales with this number.
      # 512 keeps the worst-case 12MP-upload peak comfortably under the cap and
      # loses nothing meaningful: HAM10000 is natively ~600x450 and the
      # classifier always resizes to 224px. Raise this on a larger instance.
      - key: DERM_MAX_INPUT_DIM
        value: "512"
      # Bound glibc's per-arena free-list growth (see Dockerfile).
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Single-threaded torch: a fractional CPU has nothing to gain from more
      # threads, and extra threads each carry stack + arena overhead.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      # Unset = unauthenticated (matches the current app configuration).
      # To require a key, add DERM_API_KEY as a secret in the Render
      # dashboard under this service's Environment tab.
